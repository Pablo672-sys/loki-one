# Loki Store installer v2
name: Loki Store installs

on:
  push:
    paths:
      - 'app/index.html'
      - 'app/store.js'
      - '.github/workflows/loki-store-installs.yml'

permissions:
  contents: write

jobs:
  install-store-module:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: install Loki Store module') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect Store module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="store.js?v=2"></script>'
          if tag not in s:
              marker='</body></html>'
              if marker not in s:
                  raise SystemExit('HTML closing marker not found')
              s=s.replace(marker, tag+marker, 1)
          s=s.replace('<title>Loki One 1.2</title>','<title>Loki One 2.1</title>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only when needed
        run: |
          git config user.name "loki-one-bot"
          git config user.email "41898282+loki-one-bot@users.noreply.github.com"
          git add app/index.html
          if git diff --cached --quiet; then
            echo "Store module already connected."
          else
            git commit -m "chore: install Loki Store module"
            git push
          fi
