name: Build Loki One Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Sync current Loki One Web app into Android
        run: cp ../app/index.html app/src/main/assets/index.html

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk loki-one.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v2.0.${{ github.run_number }}"
          gh release create "$TAG" "loki-one.apk" --title "Loki One Android $TAG" --notes "Loki One 2.0 para Android. APK de distribuição/teste gerado automaticamente a partir da versão atual do app Web."
