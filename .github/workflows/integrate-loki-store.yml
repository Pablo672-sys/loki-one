name: Integrate Loki Store

on:
  push:
    paths:
      - 'app/store.js'
      - 'app/index.html'
      - '.github/workflows/integrate-loki-store.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: integrate Loki Store') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Store module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="store.js?v=1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('body marker not found')
              s=s.replace(marker,tag+marker,1)
          s=s.replace('<title>Loki One 1.2</title>','<title>Loki One 2.1</title>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "loki-one-bot"
          git config user.email "41898282+loki-one-bot@users.noreply.github.com"
          git add app/index.html
          if git diff --cached --quiet; then
            echo "Already integrated."
          else
            git commit -m "chore: integrate Loki Store"
            git push
          fi
