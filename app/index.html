<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="../manifest.webmanifest"><title>Loki One</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}body{background:#060a12}.os{width:min(100vw,520px);height:100vh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 20% 10%,#3e5eb4,transparent 30%),linear-gradient(145deg,#080d18,#111a33 55%,#080b14)}.s{position:absolute;inset:0;display:none;padding:18px 16px 100px;overflow:auto}.s.on{display:block}.top{display:flex;justify-content:space-between;color:#aeb8d0;font-size:12px;padding-top:5px}.brand{text-align:center;margin:24px 0}.brand h1{margin:0;font-size:42px;letter-spacing:.08em}.brand p{color:#9fa9c2}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px}.app{border:0;background:none;color:inherit;text-align:center;cursor:pointer}.ico{width:58px;height:58px;margin:auto;border-radius:18px;display:grid;place-items:center;background:#ffffff16;border:1px solid #ffffff20;font-size:28px}.lbl{display:block;color:#aab4cc;font-size:11px;margin-top:6px}.dock{position:absolute;bottom:14px;left:14px;right:14px;display:grid;grid-template-columns:repeat(4,1fr);padding:10px;border:1px solid #ffffff20;border-radius:24px;background:#ffffff12;backdrop-filter:blur(16px)}.head{display:flex;gap:12px;align-items:center;font-size:22px;font-weight:800}.back,.btn{border:1px solid #ffffff20;background:#ffffff12;color:#fff;border-radius:14px;padding:10px 13px;cursor:pointer}.card{margin-top:14px;padding:16px;border:1px solid #ffffff20;border-radius:20px;background:#ffffff10}.store{display:grid;gap:10px}.row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #ffffff20;border-radius:18px;background:#ffffff0c}.grow{flex:1}.game{position:absolute;inset:0;background:linear-gradient(#69b8e8 0 48%,#6da64e 48% 100%);overflow:hidden}.sun{position:absolute;right:10%;top:8%;font-size:52px}.ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#4e7f38 0 28px,#477533 28px 56px)}.runner{position:absolute;right:12%;bottom:22%;font-size:50px;z-index:4}.thing{position:absolute;bottom:22%;font-size:40px;z-index:3}.score{position:absolute;top:18px;left:15px;padding:8px 12px;border-radius:14px;background:#0005;z-index:6}.close{position:absolute;top:18px;right:15px;z-index:6}.browser input{width:100%;padding:13px;border:1px solid #ffffff20;border-radius:14px;background:#0004;color:#fff;outline:0}.browser iframe{width:100%;height:58vh;border:1px solid #ffffff20;border-radius:16px;margin-top:10px;background:#fff}</style><body><main class="os"><section id="home" class="s on"><div class="top"><span id="time">00:00</span><span>Wi‑Fi 🔋</span></div><div class="brand"><h1>LOKI ONE</h1><p>Seu sistema. Seu mundo.</p></div><div class="grid" id="apps"></div></section><section id="store" class="s"><div class="head"><button class="back" onclick="go('home')">←</button>Loki Store</div><div class="store" style="margin-top:16px" id="storeList"></div></section><section id="browser" class="s browser"><div class="head"><button class="back" onclick="go('home')">←</button>Navegador</div><div class="card"><input id="url" value="https://www.google.com" placeholder="Digite um endereço"></div><button class="btn" style="margin-top:10px" onclick="browse()">Abrir</button><iframe id="frame" src="about:blank" title="Navegador"></iframe></section><section id="info" class="s"><div class="head"><button class="back" onclick="go('home')">←</button><span id="title">App</span></div><div class="card"><p id="txt"></p></div></section><section id="game" class="s" style="padding:0"><div class="game"><div class="score">🏆 <span id="score">0</span> 🪙 <span id="coins">0</span></div><button class="btn close" onclick="stopGame();go('home')">✕</button><div class="sun">☀️</div><div class="ground"></div><div class="runner" id="runner">🏃</div><div id="things"></div></div></section><nav class="dock"><button class="app" onclick="go('home')"><span class="ico">⌂</span></button><button class="app" onclick="go('store')"><span class="ico">🛍️</span></button><button class="app" onclick="go('browser')"><span class="ico">🌐</span></button><button class="app" onclick="info('Configurações','Loki One V0.5 • sistema em desenvolvimento.')"><span class="ico">⚙️</span></button></nav></main><script>const screens=document.querySelectorAll('.s');let raf=0,run=false,score=0,coins=0,jump=false,jt=0,items=[];function go(id){screens.forEach(x=>x.classList.toggle('on',x.id===id));if(id==='game')startGame()}function info(t,x){document.getElementById('title').textContent=t;document.getElementById('txt').textContent=x;go('info')}function clock(){const d=new Date();document.getElementById('time').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);const apps=[['🎮','Jungle Run','game'],['🛍️','Loki Store','store'],['🌐','Navegador','browser'],['⏰','Relógio','clock'],['📝','Notas','notes'],['📅','Calendário','calendar'],['✅','Tarefas','tasks'],['🔔','Notificações','notify']];document.getElementById('apps').innerHTML=apps.map(a=>`<button class="app" onclick="openApp('${a[2]}')"><span class="ico">${a[0]}</span><span class="lbl">${a[1]}</span></button>`).join('');function openApp(id){if(id==='game'||id==='store'||id==='browser')go(id);else info(id[0].toUpperCase()+id.slice(1),'Este app do Loki One está disponível nesta versão de teste.')}document.getElementById('storeList').innerHTML=[['🎮','Jungle Run','Jogo'],['🧮','Calculadora','Ferramenta'],['📝','Notas','Produtividade']].map(a=>`<div class="row"><div style="font-size:28px">${a[0]}</div><div class="grow"><b>${a[1]}</b><div style="color:#aab4cc;font-size:12px">${a[2]}</div></div><button class="btn" onclick="${a[1]==='Jungle Run'?'go(\'game\')':'info(\''+a[1]+'\',\'App de demonstração\')'}">${a[1]==='Jungle Run'?'Abrir':'Instalar'}</button></div>`).join('');function browse(){let u=document.getElementById('url').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;document.getElementById('url').value=u;try{document.getElementById('frame').src=u}catch{window.open(u,'_blank')}}function jumpNow(){if(!run||jump)return;jump=true;jt=0}document.getElementById('game').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;jumpNow()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jumpNow()});function startGame(){stopGame();run=true;score=coins=0;items=[];document.getElementById('things').innerHTML='';document.getElementById('score').textContent='0';document.getElementById('coins').textContent='0';loop()}function stopGame(){run=false;cancelAnimationFrame(raf);items.forEach(o=>o.el.remove());items=[]}function spawn(){const el=document.createElement('div');el.className='thing';el.textContent=Math.random()<.35?'🪙':'🌳';el.style.left='-60px';document.getElementById('things').appendChild(el);items.push({el,x:-60,coin:el.textContent==='🪙'})}function loop(){if(!run)return;raf=requestAnimationFrame(loop);score++;document.getElementById('score').textContent=Math.floor(score/8);if(Math.random()<.02)spawn();const r=document.getElementById('runner');if(jump){jt+=16;const p=jt/500;r.style.transform=`translateY(${-110*Math.sin(Math.min(p,1)*Math.PI)}px)`;if(p>=1){jump=false;r.style.transform='translateY(0)'}}for(let i=items.length-1;i>=0;i--){const o=items[i];o.x+=4+score/500;o.el.style.left=o.x+'px';const a=r.getBoundingClientRect(),b=o.el.getBoundingClientRect();if(!(a.right<b.left+10||a.left>b.right-10||a.bottom<b.top+10||a.top>b.bottom-8)){if(o.coin){coins++;document.getElementById('coins').textContent=coins;o.el.remove();items.splice(i,1)}else{alert('Fim de jogo! Pontuação: '+Math.floor(score/8));startGame();return}}if(o.x>innerWidth+100){o.el.remove();items.splice(i,1)}}}</script></body></html>
