<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Loki One"><link rel="manifest" href="manifest.webmanifest"><title>Loki One</title><style>:root{--t:#fff;--m:#aeb8d0;--g:#ffffff12;--b:#ffffff22}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:var(--t)}body{background:linear-gradient(145deg,#080d18,#121a35 55%,#080b14)}button{font:inherit;color:inherit}.screen{display:none;position:absolute;inset:0;overflow:auto;padding-bottom:100px}.screen.on{display:block}.lock{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 25% 15%,#5e7cff55,transparent 32%),radial-gradient(circle at 80% 80%,#b84cff33,transparent 30%),linear-gradient(145deg,#080d18,#121a35 55%,#080b14)}.lock h1{letter-spacing:.15em;font-size:14px;color:var(--m)}.time{font-size:84px;font-weight:220;letter-spacing:-.06em}.date{color:var(--m);text-transform:capitalize}.btn{border:1px solid var(--b);border-radius:16px;background:var(--g);padding:13px 17px;font-weight:800;cursor:pointer}.unlock{margin-top:42px}.head{display:flex;align-items:center;gap:12px;padding:20px 16px 12px;font-weight:800;font-size:22px}.back{width:42px;height:42px}.wrap{width:calc(100% - 32px);margin:auto}.search{display:flex;gap:8px;align-items:center;padding:13px 15px;border:1px solid var(--b);border-radius:18px;background:var(--g);margin-bottom:20px}.search input{flex:1;background:transparent;border:0;outline:0;color:inherit}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}.app{background:transparent;border:0;cursor:pointer}.ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;margin:auto auto 7px;font-size:27px;border:1px solid var(--b);background:var(--g)}.lbl{font-size:12px;color:var(--m);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card{padding:16px;border:1px solid var(--b);border-radius:22px;background:var(--g);margin-bottom:12px}.dock{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px;border:1px solid var(--b);border-radius:22px;background:#ffffff10;backdrop-filter:blur(18px)}.dock button{border:0;background:transparent}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc button{height:58px}.display{padding:18px;border:1px solid var(--b);border-radius:18px;text-align:right;font-size:34px;margin-bottom:10px}.note{width:100%;min-height:220px;padding:14px;border:1px solid var(--b);border-radius:18px;background:#0002;color:inherit;outline:0}.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);padding:10px 14px;border:1px solid var(--b);border-radius:14px;background:#101522dd;display:none}.toast.show{display:block}</style></head><body>
<section id="lock" class="screen on"><div class="lock"><div><h1>🔒 LOKI ONE</h1><div class="time" id="lt">00:00</div><div class="date" id="ld">...</div><button class="btn unlock" onclick="go('home')">Desbloquear →</button></div></div></section>
<section id="home" class="screen"><div class="wrap"><div class="head" style="justify-content:center;display:block;text-align:center;padding-top:32px"><div style="font-size:38px;letter-spacing:.08em">LOKI ONE</div><div style="font-size:11px;color:var(--m);letter-spacing:.18em">SEU SISTEMA. SEU MUNDO.</div></div><div style="text-align:center;margin:18px 0"><div class="time" style="font-size:70px" id="ht">00:00</div><div class="date" id="hd">...</div></div><label class="search">⌕<input id="q" placeholder="Pesquisar no Loki One"></label><div class="apps" id="apps"></div></div><nav class="dock"><button onclick="go('home')"><div class="ico">⌂</div></button><button onclick="go('store')"><div class="ico">🛍️</div></button><button onclick="go('tasks')"><div class="ico">✅</div></button><button onclick="go('settings')"><div class="ico">⚙️</div></button></nav></section>
<section id="store" class="screen"><div class="head"><button class="btn back" onclick="go('home')">←</button>Loki Store</div><div class="wrap" id="storeList"></div></section>
<section id="tasks" class="screen"><div class="head"><button class="btn back" onclick="go('home')">←</button>Tarefas</div><div class="wrap"><div class="card" style="display:flex;gap:8px"><input id="task" placeholder="Adicionar tarefa..." style="flex:1;background:transparent;color:inherit;border:1px solid var(--b);border-radius:12px;padding:11px"><button class="btn" onclick="addTask()">Adicionar</button></div><div id="taskList"></div></div></section>
<section id="settings" class="screen"><div class="head"><button class="btn back" onclick="go('home')">←</button>Configurações</div><div class="wrap"><div class="card"><b>Loki One</b><p style="color:var(--m)">Versão Web • protótipo</p><button class="btn" onclick="toggleTheme()">🌙 Alternar tema</button></div></div></section>
<section id="notes" class="screen"><div class="head"><button class="btn back" onclick="go('home')">←</button>Notas</div><div class="wrap"><div class="card"><textarea class="note" id="note" placeholder="Escreva uma nota..."></textarea><button class="btn" style="width:100%;margin-top:9px" onclick="saveNote()">💾 Salvar</button></div></div></section>
<section id="calc" class="screen"><div class="head"><button class="btn back" onclick="go('home')">←</button>Calculadora</div><div class="wrap"><div class="display" id="d">0</div><div class="calc" id="cg"></div></div></section>
<div class="toast" id="toast"></div>
<script>const apps=[['notes','Notas','📝'],['calc','Calculadora','🧮'],['store','Loki Store','🛍️'],['tasks','Tarefas','✅'],['clock','Relógio','⏰'],['game','Jungle Run','🎮'],['browser','Navegador','🌐'],['settings','Configurações','⚙️']];function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id==='clock'||id==='game'||id==='browser'?'home':id).classList.add('on');if(id==='notes')document.getElementById('note').value=localStorage.note||'';if(id==='store')renderStore();if(id==='tasks')renderTasks()}function clock(){const n=new Date(),t=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),dt=n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});['lt','ht'].forEach(x=>document.getElementById(x).textContent=t);['ld','hd'].forEach(x=>document.getElementById(x).textContent=dt)}setInterval(clock,1000);clock();function renderApps(){const el=document.getElementById('apps');el.innerHTML=apps.map(a=>`<button class="app" onclick="go('${a[0]}')"><div class="ico">${a[2]}</div><span class="lbl">${a[1]}</span></button>`).join('')}renderApps();function toast(m){const x=document.getElementById('toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}function renderStore(){document.getElementById('storeList').innerHTML='<div class="card"><b>🎮 Jungle Run</b><p style="color:var(--m)">Primeiro jogo do Loki One.</p><button class="btn" onclick="toast(\'Jungle Run já está disponível na versão Web\')">Abrir</button></div><div class="card"><b>📝 Notas</b><p style="color:var(--m)">Notas locais.</p><button class="btn" onclick="go(\'notes\')">Abrir</button></div>'}function addTask(){const i=document.getElementById('task'),v=i.value.trim();if(!v)return;const a=JSON.parse(localStorage.tasks||'[]');a.push({t:v,d:false});localStorage.tasks=JSON.stringify(a);i.value='';renderTasks();toast('Tarefa adicionada ✓')}function renderTasks(){const a=JSON.parse(localStorage.tasks||'[]');document.getElementById('taskList').innerHTML=a.length?a.map((x,i)=>`<div class="card"><button class="btn" onclick="toggleTask(${i})">${x.d?'✓':'○'}</button> <span style="text-decoration:${x.d?'line-through':'none'}">${x.t}</span> <button class="btn" style="float:right" onclick="delTask(${i})">🗑️</button></div>`).join(''):'<div class="card" style="color:var(--m);text-align:center">Nenhuma tarefa.</div>'}function toggleTask(i){const a=JSON.parse(localStorage.tasks||'[]');a[i].d=!a[i].d;localStorage.tasks=JSON.stringify(a);renderTasks()}function delTask(i){const a=JSON.parse(localStorage.tasks||'[]');a.splice(i,1);localStorage.tasks=JSON.stringify(a);renderTasks()}function saveNote(){localStorage.note=document.getElementById('note').value;toast('Nota salva ✓')}function toggleTheme(){document.body.classList.toggle('light');toast('Tema alternado')}const keys=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];let ex='';document.getElementById('cg').innerHTML=keys.map(k=>`<button class="btn" onclick="cal('${k}')">${k}</button>`).join('');function cal(k){if(k==='C')ex='';else if(k==='⌫')ex=ex.slice(0,-1);else if(k==='='){try{const j=ex.replaceAll('÷','/').replaceAll('×','*').replaceAll('−','-');if(!/^[0-9+\-*/().\s]+$/.test(j))throw 0;ex=String(Function('return ('+j+')')())}catch{ex='Erro'}}else ex+=k;document.getElementById('d').textContent=ex||'0'}</script></body></html>
