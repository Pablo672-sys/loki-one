<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071024"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Loki One"><link rel="manifest" href="../manifest.webmanifest"><title>Loki One 2.1</title><link rel="stylesheet" href="../loki-android.css?v=3"><style>:root{--bg:#071024;--panel:#ffffff0c;--line:#ffffff20;--muted:#aeb9d8;--text:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer}.device{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 18% 8%,#17346caa,transparent 34%),radial-gradient(circle at 85% 78%,#321c67aa,transparent 28%),linear-gradient(145deg,#071024,#0b1836 58%,#050a16)}.status{flex:0 0 34px;padding:7px 18px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.viewport{flex:1;min-height:0;overflow:hidden;padding:0 18px}.screen{height:100%;display:none;overflow:auto;padding:8px 0 18px}.screen.on{display:block}.toolbar{height:42px;display:flex;justify-content:flex-end}.glass{border:1px solid var(--line);background:#ffffff0c;box-shadow:0 12px 35px #0005,inset 0 1px #ffffff10;backdrop-filter:blur(18px)}.quick,.btn{border-radius:14px;background:#ffffff10;border:1px solid var(--line);padding:10px 13px}.hero{text-align:center}.hero h1{font-size:42px;margin:0 0 8px}.hero p,.muted{color:var(--muted);font-size:12px}.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.widget,.card,.row{border-radius:20px;padding:14px}.clockWidget .time{font-size:42px;font-weight:250}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;margin:16px 0}.app{text-align:center;background:none}.appIcon{width:62px;height:62px;margin:auto;display:grid;place-items:center;border-radius:19px;font-size:30px;border:1px solid var(--line);background:#ffffff12}.appLabel{display:block;margin-top:7px;color:#c7d0e4;font-size:11px}.dockArea{padding:8px 18px 12px}.dock{height:68px;border-radius:26px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.dockBtn{background:none}.dockIcon{width:42px;height:42px;margin:auto;border-radius:14px;display:grid;place-items:center;font-size:22px;background:#ffffff10;border:1px solid var(--line)}.dockLabel{display:block;font-size:10px;text-align:center}.head{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin:4px 0 14px}.row{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);margin-bottom:10px}.grow{flex:1}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);display:none;padding:10px 14px;border-radius:14px;background:#101522ed;border:1px solid var(--line);z-index:300}.toast.on{display:block}@media(max-width:390px){.widgets{grid-template-columns:1fr}.hero h1{font-size:36px}.appIcon{width:58px;height:58px}}</style><link rel="stylesheet" href="../loki-android.css?v=2"></head><body><main class="device"><header class="status"><span id="statusTime">00:00</span><span>◉ Wi‑Fi</span><span>🔋 100%</span></header><div class="viewport"><section id="home" class="screen on"><div class="toolbar"><button class="quick glass" onclick="toast('Painel rápido')">⌄</button></div><div class="hero"><h1>LOKI ONE</h1><p>SEU SISTEMA. SEU MUNDO.</p></div><div class="widgets"><div class="widget glass"><b id="day"></b><div class="clockWidget"><div><div class="time" id="bigTime">00:00</div><div class="muted" id="fullDate"></div></div><span style="font-size:36px">⏰</span></div></div><div class="widget glass"><b>⚡ Controles</b><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:18px"><button class="btn">📶</button><button class="btn">ᛒ</button><button class="btn">✈️</button><button class="btn">🔊</button></div></div><div class="widget glass"><b>✅ Próxima tarefa</b><p id="nextTask">Nenhuma tarefa pendente</p></div><div class="widget glass"><b>🎵 Loki Music</b><p class="muted">Pronto para tocar</p></div></div><div class="apps" id="apps"></div></section><section id="store" class="screen"><div class="head"><button class="btn" onclick="go('home')">←</button>Loki Store</div><p class="muted">Baixe os aplicativos que quiser. Os instalados podem ser removidos.</p><div id="storeList"></div></section><section id="notifications" class="screen"><div class="head"><button class="btn" onclick="go('home')">←</button>Notificações</div><div id="notifList"></div></section><section id="settings" class="screen"><div class="head"><button class="btn" onclick="go('home')">←</button>Configurações</div><div class="row glass"><div class="grow"><b>⚙️ Loki One 2.1</b><div class="muted">Sistema atualizado</div></div></div></section></div><footer class="dockArea"><nav class="dock glass"><button class="dockBtn" onclick="go('home')"><div class="dockIcon">⌂</div><span class="dockLabel">Início</span></button><button class="dockBtn" onclick="go('notifications')"><div class="dockIcon">🔔</div><span class="dockLabel">Avisos</span></button><button class="dockBtn" onclick="go('store')"><div class="dockIcon">🛍️</div><span class="dockLabel">Store</span></button><button class="dockBtn" onclick="go('settings')"><div class="dockIcon">⚙️</div><span class="dockLabel">Ajustes</span></button></nav></footer><div id="toast" class="toast"></div></main><script>const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1600)}function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id)?.classList.add('on');if(id==='store')renderStore()}const catalog=[['game','🎮','Jungle Run','Jogo de corrida'],['tasks','✅','Tarefas','Organize seu dia'],['notes','📝','Notas','Suas ideias'],['calendar','📅','Calendário','Seus compromissos'],['clockApp','⏰','Relógio','Relógio local'],['calc','🧮','Calculadora','Cálculos rápidos'],['browser','🌐','Navegador','Sites externos'],['music','🎵','Loki Music','Player de música'],['files','📁','Arquivos','Seus arquivos'],['notifications','🔔','Notificações','Central de avisos'],['settings','⚙️','Configurações','Ajustes do sistema'],['store','🛍️','Loki Store','Gerencie seus apps']];const core=['store','files','notifications','settings'];let installed=JSON.parse(localStorage.getItem('loki_installed_apps')||'null');if(!Array.isArray(installed)){installed=[...core];localStorage.setItem('loki_installed_apps',JSON.stringify(installed))}function save(){localStorage.setItem('loki_installed_apps',JSON.stringify(installed))}function renderApps(){$('apps').innerHTML=catalog.filter(a=>installed.includes(a[0])).map(a=>`<button class="app" onclick="go('${a[0]}')"><span class="appIcon">${a[1]}</span><span class="appLabel">${a[2]}</span></button>`).join('')}function renderStore(){$('storeList').innerHTML=catalog.map(a=>{let has=installed.includes(a[0]),essential=core.includes(a[0]);let action=essential?'<button class="btn" disabled>Incluído</button>':has?`<div><button class="btn" onclick="go('${a[0]}')">Abrir</button> <button class="btn" onclick="uninstallApp('${a[0]}')">Desinstalar</button></div>`:`<button class="btn" onclick="installApp('${a[0]}',this)">Baixar</button>`;return `<div class="row glass"><div class="appIcon" style="margin:0">${a[1]}</div><div class="grow"><b>${a[2]}</b><div class="muted">${a[3]}${essential?' • essencial':''}</div></div>${action}</div>`}).join('')}function installApp(id,b){b.disabled=true;b.textContent='Baixando…';setTimeout(()=>{if(!installed.includes(id))installed.push(id);save();renderApps();renderStore();toast('Loki Store: app instalado ✓')},700)}function uninstallApp(id){if(core.includes(id))return;installed=installed.filter(x=>x!==id);save();renderApps();renderStore();toast('Loki Store: app desinstalado')}function tick(){let d=new Date(),t=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('statusTime').textContent=t;$('bigTime').textContent=t;$('day').textContent=d.toLocaleDateString('pt-BR',{weekday:'long'});$('fullDate').textContent=d.toLocaleDateString('pt-BR')}setInterval(tick,1000);tick();renderApps();renderStore();</script></body></html>
